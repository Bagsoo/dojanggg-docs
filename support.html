<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 지원 — 도장깨기</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --blue: #255DFF;
      --bg: #090D1A;
      --border: rgba(255,255,255,0.08);
      --text: #F0F4FF; --text-2: rgba(240,244,255,0.60); --text-3: rgba(240,244,255,0.35);
      --card-bg: rgba(255,255,255,0.04); --card-border: rgba(255,255,255,0.07);
      --blue-text: #7DA5FF;
    }
    [data-theme="light"] {
      --bg: #F5F7FF;
      --border: rgba(0,0,0,0.07);
      --text: #0B1230; --text-2: rgba(11,18,48,0.58); --text-3: rgba(11,18,48,0.35);
      --card-bg: rgba(255,255,255,0.90); --card-border: rgba(0,0,0,0.08);
      --blue-text: #1A4BCC;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; transition: background 0.3s, color 0.3s;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 60px;
      background: rgba(9,13,26,0.80);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s;
    }
    [data-theme="light"] nav { background: rgba(245,247,255,0.85); }
    .nav-logo { font-size: 16px; font-weight: 800; text-decoration: none; color: var(--text); }
    .nav-logo span { color: var(--blue); }
    .nav-back { font-size: 13px; color: var(--text-2); text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--blue); }
    .theme-toggle {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: none; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .theme-toggle:hover { transform: scale(1.1); }
    [data-theme="light"] .theme-toggle { background: rgba(0,0,0,0.07); }

    .card { max-width: 480px; width: 100%; margin-top: 60px; }
    .icon { font-size: 36px; text-align: center; margin-bottom: 6px; }
    h1 { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 32px; letter-spacing: -0.5px; }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px; padding: 22px 24px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .section:hover { border-color: rgba(37,93,255,0.25); }
    .section h2 {
      font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
      color: var(--blue-text); margin-bottom: 10px;
    }
    .section p { font-size: 14px; color: var(--text-2); line-height: 1.7; margin: 0; }
    .contact {
      color: var(--text); font-weight: 700;
      font-size: 16px; text-decoration: none;
      transition: color 0.2s;
    }
    .contact:hover { color: var(--blue); }
    .label { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }

    ul { list-style: none; }
    ul li + li { margin-top: 10px; }
    ul a {
      color: var(--text-2); text-decoration: none;
      font-size: 14px; display: flex;
      align-items: center; justify-content: space-between;
      padding: 4px 0; transition: color 0.2s;
    }
    ul a:hover { color: var(--blue); }
    ul a::after { content: '›'; font-size: 18px; opacity: 0.4; }

    footer { text-align: center; margin-top: 28px; font-size: 12px; color: var(--text-3); }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">🥋 <span>도장</span>깨기</a>
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="index.html" class="nav-back">← 홈으로</a>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>
</nav>

<div class="card">
  <div class="icon">🥋</div>
  <h1>고객 지원</h1>

  <div class="section">
    <h2>이메일 문의</h2>
    <div class="label">아래 이메일로 문의해 주세요</div>
    <a class="contact" href="mailto:answer2451@gmail.com">answer2451@gmail.com</a>
  </div>

  <div class="section">
    <h2>운영 안내</h2>
    <p>접수는 24시간 가능하며, 순차적으로 답변드립니다.<br>
    앱 내 프로필 탭 하단에서도 문의할 수 있어요.</p>
  </div>

  <div class="section">
    <h2>관련 문서</h2>
    <ul>
      <li><a href="privacy.html">개인정보처리방침</a></li>
      <li><a href="location-terms.html">위치정보서비스 이용약관</a></li>
    </ul>
  </div>

  <footer>© 2026 앤써 (Answer)</footer>
</div>

<script>
  const t = document.getElementById('themeToggle');
  const h = document.documentElement;
  const s = localStorage.getItem('theme') || 'dark';
  h.setAttribute('data-theme', s); t.textContent = s === 'dark' ? '🌙' : '☀️';
  t.addEventListener('click', () => {
    const n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    h.setAttribute('data-theme', n); t.textContent = n === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('theme', n);
  });
</script>
</body>
</html>
